{% extends "base.html" %}
{% block title %}Create Meme — mini-social-media{% endblock %}
{% block content %}
<div class="card">
  <h1>🎨 Create a Meme</h1>
  <form method="POST" action="{{ url_for('create_meme') }}" enctype="multipart/form-data">
    <div class="form-group">
      <label>Choose a photo</label>
      <input type="file" name="photo" accept="image/*" data-preview="previewImg">
      <img id="previewImg" class="meme-preview" style="display:none;max-width:100%;margin-top:0.5rem;">
      <p class="meta">Or paste an existing photo URL:</p>
      <input type="url" name="photo_url" placeholder="https://...">
    </div>

    <div class="form-group">
      <label>Pick a Filter</label>
      <div class="meme-filter-list">
        {% for f in filters %}
        <label class="meme-filter-thumb">
          <input type="radio" name="filter_id" value="{{ f.id }}" {% if loop.first %}checked{% endif %} style="display:none;">
          <div style="font-size:0.8rem;font-weight:600;">{{ f.name }}</div>
          <div class="meta" style="font-size:0.7rem;">{{ f.description }}</div>
        </label>
        {% endfor %}
      </div>
    </div>

    <div class="form-group">
      <label>Caption (optional)</label>
      <textarea name="caption" rows="2" placeholder="Something witty..."></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Post Meme</button>
    <a href="{{ url_for('memes') }}" class="btn">Cancel</a>
  </form>
</div>
<script>
  document.querySelectorAll('.meme-filter-thumb').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.meme-filter-thumb').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      el.querySelector('input').checked = true;
    });
  });
</script>
{% endblock %}
