{% extends "base.html" %}
{% block title %}New Note — mini-social-media{% endblock %}
{% block content %}
<div class="card">
  <h2>Create Note</h2>
  <form method="POST">
    <div class="form-group"><label for="title">Title</label><input type="text" id="title" name="title" required></div>
    <div class="form-group"><label for="content">Content</label><textarea id="content" name="content" rows="8" required></textarea></div>
    <button type="submit" class="btn btn-primary">Create</button>
  </form>
</div>
{% endblock %}
