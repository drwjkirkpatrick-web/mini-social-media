{% extends "base.html" %}
{% block title %}Forgot Password — mini-social-media{% endblock %}
{% block content %}
<div class="card">
  <h2>Reset Your Password</h2>
  <form method="POST">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>
    <button type="submit" class="btn btn-primary">Send Reset Link</button>
  </form>
  <p class="meta" style="margin-top:1rem;"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
