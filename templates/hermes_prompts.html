{% extends "base.html" %}
{% block title %}Hermes Prompts — mini-social-media{% endblock %}
{% block content %}
<div class="card"><h2>Connection Prompts from Hermes</h2></div>
{% for p in prompts %}
<div class="card" style="border-left:4px solid var(--accent);">
  <p>{{ p.prompt_text }}</p>
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <span class="meta">{{ p.prompt_type }} · {{ p.created_at[:10] }}</span>
    <form method="POST" action="{{ url_for('dismiss_hermes_prompt_route', prompt_id=p.id) }}">
      <button type="submit" class="btn btn-small">Dismiss</button>
    </form>
  </div>
</div>
{% else %}
<div class="card"><p class="meta">No active prompts.</p></div>
{% endfor %}
{% endblock %}
