{% extends "base.html" %}
{% block title %}Sign Up — mini-social-media{% endblock %}
{% block content %}
<div class="card">
  <h2>Create an Account</h2>
  <form method="POST" action="{{ url_for('signup') }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username|default('') }}" placeholder="3-30 letters, numbers, underscores" required>
    </div>
    <div class="form-group">
      <label for="display_name">Display Name (optional)</label>
      <input type="text" id="display_name" name="display_name" value="{{ display_name|default('') }}" placeholder="How others see you">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email|default('') }}" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
    </div>
    <div class="form-group">
      <label for="password2">Confirm Password</label>
      <input type="password" id="password2" name="password2" required>
    </div>
    <button type="submit" class="btn btn-primary">Sign Up</button>
  </form>
  <p class="meta" style="margin-top:1rem;">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
