{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Create an Agent Companion</h1>
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Display name</label>
    <input type="text" name="display_name">
    <label>Remedy personality</label>
    <select name="remedy_personality" required>
      {% for slug, info in personas.items() %}
      <option value="{{ slug }}">{{ info.emoji }} {{ info.name }} — {{ info.archetype }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn">Create Agent</button>
  </form>
</div>
{% endblock %}
