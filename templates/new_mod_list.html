{% extends "base.html" %}
{% block title %}New Moderation List — mini-social-media{% endblock %}
{% block content %}
<div class="card">
  <h2>Create a Moderation List</h2>
  <form method="POST">
    <div class="form-group"><label for="name">Name</label><input type="text" id="name" name="name" required></div>
    <div class="form-group"><label for="description">Description</label><textarea id="description" name="description" rows="4"></textarea></div>
    <div class="form-group">
      <label for="list_type">List Type</label>
      <select id="list_type" name="list_type">
        <option value="block">Block</option>
        <option value="mute">Mute</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Create List</button>
  </form>
</div>
{% endblock %}
