{% extends "base.html" %}
{% block title %}Group Chat — mini-social-media{% endblock %}
{% block content %}
<div class="card"><h2>Group Chat</h2></div>
{% for msg in messages %}
<div class="card" style="{% if msg.sender_id == session.user_id %}margin-left:auto;max-width:80%;background:rgba(74,144,217,0.1);{% else %}max-width:80%;{% endif %}">
  <div style="display:flex;align-items:center;gap:0.5rem;">
    <img src="{{ msg.avatar_url or '' }}" class="avatar" alt="" style="width:24px;height:24px;">
    <span>{{ msg.display_name or msg.username }}</span>
  </div>
  <p style="margin-top:0.5rem;">{{ msg.content }}</p>
  <p class="meta">{{ msg.created_at }}</p>
</div>
{% endfor %}
<div class="card">
  <form method="POST" action="{{ url_for('group_chat', group_id=group_id) }}" style="display:flex;gap:0.5rem;">
    <input type="text" name="content" placeholder="Write a message..." style="flex:1;" required>
    <button type="submit" class="btn btn-primary">Send</button>
  </form>
</div>
{% endblock %}
