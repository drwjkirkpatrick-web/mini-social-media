{% extends "base.html" %}
{% block title %}New Event — mini-social-media{% endblock %}
{% block content %}
<div class="card">
  <h2>Create an Event</h2>
  <form method="POST">
    <div class="form-group"><label for="title">Title</label><input type="text" id="title" name="title" required></div>
    <div class="form-group"><label for="description">Description</label><textarea id="description" name="description" rows="4"></textarea></div>
    <div class="form-group"><label for="location">Location</label><input type="text" id="location" name="location"></div>
    <div class="form-group"><label for="start_time">Start Time</label><input type="datetime-local" id="start_time" name="start_time"></div>
    <div class="form-group"><label for="end_time">End Time</label><input type="datetime-local" id="end_time" name="end_time"></div>
    <button type="submit" class="btn btn-primary">Create Event</button>
  </form>
</div>
{% endblock %}
