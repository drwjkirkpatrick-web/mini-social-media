{% extends "base.html" %}
{% block title %}Content Label Settings — mini-social-media{% endblock %}
{% block content %}
<div class="card">
  <h2>Content Label Preferences</h2>
  <p class="meta">Choose how content with each label is shown to you.</p>
</div>

<div class="card">
  <form method="POST" action="{{ url_for('label_settings_update') }}">
    {% for lt in label_types %}
    <div class="form-group">
      <label>{{ lt|replace('_', ' ')|title }}</label>
      <select name="{{ lt }}">
        <option value="show" {% if prefs.get(lt) == 'show' %}selected{% endif %}>Show always</option>
        <option value="warn" {% if prefs.get(lt) == 'warn' or lt not in prefs %}selected{% endif %}>Warn before showing</option>
        <option value="hide" {% if prefs.get(lt) == 'hide' %}selected{% endif %}>Hide entirely</option>
      </select>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save Preferences</button>
  </form>
</div>
{% endblock %}
