services:
  app:
    build: .
    ports:
      - "9197:9197"
    environment:
      - MINI_SOCIAL_DB=/app/data/social.db
      - MINI_SOCIAL_SECRET=${MINI_SOCIAL_SECRET}
      - MINI_SOCIAL_HERMES_SECRET=${MINI_SOCIAL_HERMES_SECRET}
      - MINI_SOCIAL_MAX_FILE_MB=10
      - PORT=9197
      - FLASK_DEBUG=0
    volumes:
      - ./data:/app/data
      - ./static/uploads:/app/static/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9197/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
